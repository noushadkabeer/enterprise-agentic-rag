version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agentic_rag_pgvector
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: enterprise_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  redis-checkpointer:
    image: redis:7-alpine
    container_name: agentic_rag_redis
    ports:
      - "6379:6379"

volumes:
  pgvector_data:
