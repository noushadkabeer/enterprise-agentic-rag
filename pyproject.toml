[project]
name = "enterprise-agentic-rag"
version = "0.1.0"
description = "Production-grade LangGraph Multi-Agent RAG framework for complex enterprise documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.7.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
